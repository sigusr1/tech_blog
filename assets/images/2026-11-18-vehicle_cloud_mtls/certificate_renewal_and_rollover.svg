<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" role="img" aria-labelledby="certificate_renewal_and_rollover-title certificate_renewal_and_rollover-desc">
<title id="certificate_renewal_and_rollover-title">证书更新</title>
<desc id="certificate_renewal_and_rollover-desc">证书到期前，设备使用有效身份申请并安装新证书，可以继续使用原密钥对，也可以在安全硬件内重新生成新密钥对；新证书通过 mTLS 有效性验证后启用，用于后续业务或领证流程，切换完成后旧凭据退役。</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
  <path d="M0 0 L10 5 L0 10 z" fill="#55606C"/>
</marker>
</defs>
<g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-weight="500">

<line x1="292" y1="60" x2="328" y2="60" stroke="#55606C" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="584" y1="60" x2="620" y2="60" stroke="#55606C" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="876" y1="60" x2="912" y2="60" stroke="#55606C" stroke-width="2.5" marker-end="url(#ah)"/>

<rect x="40" y="24" width="248" height="72" rx="8" fill="#E4F3E9" stroke="#3E9C68" stroke-width="2"/>
<text x="164" y="68" font-size="22" fill="#1D4A31" text-anchor="middle">① 申请并安装新证书</text>
<rect x="332" y="24" width="248" height="72" rx="8" fill="#E4EFF9" stroke="#3E86C6" stroke-width="2"/>
<text x="456" y="68" font-size="22" fill="#1B466A" text-anchor="middle">② 验证新证书的有效性</text>
<rect x="624" y="24" width="248" height="72" rx="8" fill="#FCF3DA" stroke="#D9A33B" stroke-width="2"/>
<text x="748" y="68" font-size="22" fill="#6A4E10" text-anchor="middle">③ 启用新证书</text>
<rect x="916" y="24" width="248" height="72" rx="8" fill="#E4F3E9" stroke="#3E9C68" stroke-width="2"/>
<text x="1040" y="68" font-size="22" fill="#1D4A31" text-anchor="middle">④ 退役旧凭据</text>

<rect x="40" y="132" width="832" height="48" rx="8" fill="#E4F3E9" stroke="#3E9C68" stroke-width="2"/>
<text x="456" y="164" font-size="20" fill="#1D4A31" text-anchor="middle">旧证书继续使用，直至切换完成</text>
<rect x="916" y="132" width="248" height="48" rx="8" fill="none" stroke="#55606C" stroke-width="2"/>
<text x="1040" y="164" font-size="20" fill="#3C4650" text-anchor="middle">旧凭据退役</text>
<rect x="40" y="196" width="540" height="48" rx="8" fill="#E4EFF9" stroke="#3E86C6" stroke-width="2"/>
<text x="310" y="228" font-size="20" fill="#1B466A" text-anchor="middle">新证书申请、安装与有效性验证</text>
<rect x="624" y="196" width="540" height="48" rx="8" fill="#E4EFF9" stroke="#3E86C6" stroke-width="2"/>
<text x="894" y="228" font-size="20" fill="#1B466A" text-anchor="middle">新证书用于后续业务或领证流程</text>

<rect x="208" y="272" width="784" height="56" rx="8" fill="#FCF3DA" stroke="#D9A33B" stroke-width="2"/>
<text x="600" y="308" font-size="22" fill="#6A4E10" text-anchor="middle">证书更新可以继续使用原密钥对，也可以在安全硬件内重新生成新密钥对</text>

</g>
</svg>
